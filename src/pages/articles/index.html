<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Articles by Sam Blake: reflections on product design, career transitions, and building things that matter. Short essays on craft, process, and the work." />
    <title>Articles | Sam Blake, Product Designer</title>
    <meta name="theme-color" content="#f5f2ed" />
    <link rel="canonical" href="https://www.samsux.co.uk/articles" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sam Blake | Product Designer" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Articles | Sam Blake, Product Designer" />
    <meta property="og:description" content="Articles by Sam Blake: reflections on product design, career transitions, and building things that matter. Short essays on craft, process, and the work." />
    <meta property="og:url" content="https://www.samsux.co.uk/articles" />
    <meta property="og:image" content="https://www.samsux.co.uk/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Typefaces: Fraunces (headings), Urbanist (body), Caveat (hero accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Urbanist:wght@300;400;500&family=Caveat:wght@400&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>

    {{> nav navArticles=true}}

    <main>

      <section class="articles section-lg" aria-labelledby="articles-heading">
        <div class="container">
          <h1 id="articles-heading" class="articles__heading js-reveal">Articles</h1>
          <p class="articles__intro js-reveal" data-reveal-delay="50">Articles on product design, craft, and the decisions behind the work.</p>
          <ul class="articles__list js-reveal" role="list" data-reveal-delay="100">
            <li class="articles__item">
              <a href="/articles/design-systems-and-portfolio-sites" class="card">
                <div class="card__content">
                  <div class="card__body">
                    <span class="card__metric-chip">Design Systems</span>
                    <h2 class="card__title">Design systems and portfolio sites</h2>
                    <p class="card__subtitle">What building this portfolio taught me about design systems in miniature.</p>
                    <span class="btn btn--primary card__cta"><span>2 min read</span><span aria-hidden="true">→</span></span>
                  </div>
                </div>
                <!-- TODO: replace with real article image -->
                <div class="card__thumbnail" aria-hidden="true"></div>
              </a>
            </li>
          </ul>
        </div>
      </section>

    </main>


    {{> footer}}

    <script type="module" src="/src/theme.js"></script>
    <script type="module" src="/src/nav.js"></script>
    <script type="module" src="/src/reveal.js"></script>
  </body>
</html>
